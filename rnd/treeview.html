<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OWL Tree View</title>

  <!-- OWL v2 CDN -->
  <script src="https://unpkg.com/@odoo/owl@2.3.0/dist/owl.iife.js"></script>

  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #f5f5f5;
    }

   .tree-node {
  position: relative;
  margin-left: 20px;
  box-shadow: inset 0 0 4px blue;
}

.lines {
  position: absolute;
  left: -12px;
  top: 0;
  bottom: 0;
  display: flex;
}

.line {
  width: 12px;
  border-left: 1px solid #ccc;
}

.node-label {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}

.toggle {
  width: 16px;
  text-align: center;
  font-weight: bold;
}

.content {
  overflow: hidden;
  height: auto;
  opacity: 1;
  transition: height 0.3s ease, opacity 0.3s ease;
}

.box {
  padding: 2px 6px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 4px;
}

    .box {
      padding: 2px 6px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      display: inline-block;
    }

  </style>
</head>
<body>

<div id="app"></div>

<script>
const { Component, mount, useState, xml, useRef, onMounted } = owl;

/* ======================
   TREE NODE COMPONENT
====================== */

class TreeNode extends Component {
  static props = ["node", "level", "isLast"];

  setup() {
    this.state = useState({ open: true });
    this.contentRef = useRef("content");

    onMounted(() => {
      this.updateHeight();
    });
  }

  toggle() {
    this.state.open = !this.state.open;
    this.updateHeight();
  }

  updateHeight() {
    const el = this.contentRef.el;
    if (!el) return;

    if (this.state.open) {
      el.style.height = el.scrollHeight + "px";
      el.style.opacity = 1;
    } else {
      el.style.height = "0px";
      el.style.opacity = 0;
    }
  }

  get hasChildren() {
    return this.props.node.children?.length > 0;
  }
}

TreeNode.components = { TreeNode };

TreeNode.template = xml`
<div class="tree-node">

  <!-- garis vertikal -->
  <div class="lines">
    <t t-foreach="props.level || []" t-as="l" t-key="l">
      <span class="line"></span>
    </t>
  </div>

  <div class="node-label" t-on-click="toggle">
    <span class="toggle">
      <t t-if="hasChildren">
        <t t-esc="state.open ? '⊟' : '⊞'"/>
      </t>
    </span>

    <div class="box">
      <b><t t-esc="props.node.object"/></b>
      (<t t-esc="props.node.class"/>)
    </div>
  </div>

  <div class="content" t-ref="content">

    <t t-if="hasChildren">
      <t t-foreach="props.node.children" t-as="child" t-key="child.object">
        <TreeNode 
          node="child" 
          level="(props.level || []).concat([1])"
          isLast="child === props.node.children[props.node.children.length - 1]"
        />
      </t>
    </t>

  </div>
</div>
`;
/* ======================
   ROOT APP
====================== */
class App extends Component {
  setup() {
    this.data = {
      "object":"Form1",
      "class":"TForm",
      "properties":{"Caption":"Form 1","Left":10,"Top":10,"Width":400,"Height":325},
      "children":[
        {
          "object":"pnl2",
          "class":"TPanel",
          "properties":{"Caption":"Sub Panel","Left":10,"Top":40,"Width":100,"Height":230},
          "children":[
            {
              "object":"unknown1",
              "class":"UnknownTComponent",
              "properties":{"UnknownProp1":"Custom Data","Left":10,"Top":40,"Width":100,"Height":230},
              "children":[]
            }
          ]
        },
        {
          "object":"btnOK",
          "class":"TButton",
          "properties":{"Caption":"OK","Left":10,"Top":10,"Width":100,"Height":23},
          "children":[]
        },
        {
          "object":"btnCancel",
          "class":"TButton",
          "properties":{"Caption":"Cancel","Left":150,"Top":10,"Width":100,"Height":23},
          "children":[]
        },
        {
          "object":"pnl3",
          "class":"TPanel",
          "properties":{"Caption":"Sub Panel","Left":10,"Top":40,"Width":100,"Height":230},
          "children":[
            {
              "object":"unknown2",
              "class":"UnknownTComponent",
              "properties":{"UnknownProp1":"Custom Data","Left":10,"Top":40,"Width":100,"Height":230},
              "children":[]
            }
          ]
        },
        {
          "object":"customerdata",
          "class":"UnknownTComponent",
          "properties":{"UnknownProp1":"Custom Data","Left":150,"Top":40,"Width":100,"Height":230},
          "children":[]
        }
      ]
    };
  }
}

App.components = { TreeNode };

App.template = xml`
<div>
  <TreeNode node="data" level="[]"/>
</div>
`;

/* ======================
   MOUNT
====================== */
mount(App, document.getElementById("app"), {debug:true});
</script>

</body>
</html>
